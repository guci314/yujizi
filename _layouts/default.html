<!doctype html>
<html lang="zh-Hans" data-theme="light">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="玉机子道长道家内丹诵读 · 太乙金华宗旨、道德经、阴符经等经典讲解与音频">
    <meta name="theme-color" content="#f4efe3">
    <link rel="icon" href="/favicon.ico">
    <title>{{ page.title }} · 玉机子道长</title>

    <!-- 尽早定主题,避免昼夜闪烁 -->
    <script>
        (function () {
            try {
                var t = localStorage.getItem('yjz-theme');
                if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                document.documentElement.setAttribute('data-theme', t);
            } catch (e) {}
        })();
    </script>

    <link href="/css/bootstrap.min.css" rel="stylesheet">
    <link href="/style.css" rel="stylesheet">
</head>

<body>
    <div class="shell" id="top">

        <header class="masthead">
            <div class="wrap">
                <a href="/index.html" class="brand">
                    <span class="seal">玉機</span>
                    <span class="brand-name">玉机子道长</span>
                </a>
                <span class="spacer"></span>
                <button class="nav-act" id="drawer-btn" aria-expanded="false" aria-controls="drawer">须知 · 设置</button>
                <button class="nav-act theme-toggle" id="theme-btn" aria-label="切换昼夜">
                    <span class="sun">☀ 昼</span><span class="moon">☾ 夜</span>
                </button>
            </div>

            <div class="drawer" id="drawer">
                <div class="wrap">
                    <div class="drawer-grid">
                        <div>
                            <p class="drawer-h">须知</p>
                            <p>我不认识玉机子道长。本站的制作也未经玉师同意。请不要向我打听玉师的联系方式。</p>
                            <p>网页会记忆每个音频的播放位置，下次自动从该处继续。</p>
                            <p style="margin-top:1rem">
                                <button class="btn-ink" onclick="reset()">清除播放记忆</button>
                                <button class="btn-ink" onclick="back30sec()">后退 30 秒</button>
                            </p>
                        </div>
                        <div>
                            <p class="drawer-h">定时关闭</p>
                            <label class="lbl" for="myselect">睡前定时停止播放</label>
                            <select id="myselect" class="field">
                                <option value="-1">不开启</option>
                                <option value="300000">5 分钟</option>
                                <option value="600000">10 分钟</option>
                                <option value="1800000">30 分钟</option>
                                <option value="3600000">一小时</option>
                                <option value="7200000">两小时</option>
                            </select>
                            <p class="remain" style="margin-top:.9rem">剩余 <span id="remainTime">—</span></p>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <main role="main">
            <div class="wrap">
                {% unless page.hide_title %}
                <div class="page-head">
                    <p class="kicker">玉机子道长 · 讲习</p>
                    <h1>{{ page.title }}</h1>
                </div>
                {% endunless %}
                <div class="reader">
                    {{ content }}
                </div>
            </div>
        </main>

        <footer class="colophon">
            <div class="wrap">
                <p class="verse">剔刀锋利，越之不易。智者有云，得渡者稀。<span class="src">《奥义书》</span></p>
                <span class="foot-seal">玉</span>
                <p class="links"><a href="/index.html">返回主页</a> · <a href="#top">返回顶部</a></p>
            </div>
        </footer>
    </div>

    <a href="#top" class="totop" id="totop" aria-label="返回顶部">↑</a>

    <script src="/js/jquery-3.2.1.slim.min.js"></script>
    <script src="/js/yujizi.js"></script>
    <script>
        (function () {
            var html = document.documentElement;
            var tb = document.getElementById('theme-btn');
            if (tb) tb.addEventListener('click', function () {
                var n = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
                html.setAttribute('data-theme', n);
                try { localStorage.setItem('yjz-theme', n); } catch (e) {}
                var m = document.querySelector('meta[name=theme-color]');
                if (m) m.setAttribute('content', n === 'dark' ? '#15171b' : '#f4efe3');
            });
            var db = document.getElementById('drawer-btn'), d = document.getElementById('drawer');
            if (db) db.addEventListener('click', function () {
                var open = d.classList.toggle('open');
                db.setAttribute('aria-expanded', open);
            });
            var tt = document.getElementById('totop');
            if (tt) addEventListener('scroll', function () { tt.classList.toggle('show', scrollY > 500); }, { passive: true });
        })();
    </script>
</body>

</html>
