<!doctype html>
<html lang="zh-Hans" data-theme="light">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="{{ page.title }} · 玉机子道长诵读音频">
    <meta name="theme-color" content="#f4efe3">
    <link rel="icon" href="/favicon.ico">
    <title>{{ page.title }} · 玉机子道长</title>

    <script>
        (function () {
            try {
                var t = localStorage.getItem('yjz-theme');
                if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                document.documentElement.setAttribute('data-theme', t);
            } catch (e) {}
        })();
    </script>

    <link href="/css/bootstrap.min.css" rel="stylesheet">
    <link href="/style.css" rel="stylesheet">
</head>

<body>
    <div class="shell" id="top">

        <header class="masthead">
            <div class="wrap">
                <a href="/index.html" class="brand">
                    <span class="seal">玉機</span>
                    <span class="brand-name">玉机子道长</span>
                </a>
                <span class="spacer"></span>
                <a class="nav-act" href="/index.html">经目</a>
                <button class="nav-act theme-toggle" id="theme-btn" aria-label="切换昼夜">
                    <span class="sun">☀ 昼</span><span class="moon">☾ 夜</span>
                </button>
            </div>
        </header>

        <main role="main">
            <div class="wrap">
                <div class="page-head">
                    <p class="kicker">愿清静 · 济化人间</p>
                    <h1>{{ page.title }}</h1>
                </div>

                <div class="reader">
                    {{ content }}
                </div>

                <!-- 播放器:保留全部 JS 契约 ID,只换皮 -->
                <div class="player" id="player">
                    <div class="row">
                        <div class="grow">
                            <label class="lbl" for="music-select">曲目</label>
                            <select id="music-select" class="field" style="width:100%">
                                <option value="">请选择音频</option>
                            </select>
                        </div>
                        <div>
                            <label class="lbl" for="play-mode">播放方式</label>
                            <select id="play-mode" class="field">
                                <option value="continuous" selected>连续播放</option>
                                <option value="loop">单曲循环</option>
                                <option value="stop-after">播放完停止</option>
                            </select>
                        </div>
                        <div>
                            <label class="lbl" for="myselect">定时关闭</label>
                            <select id="myselect" class="field">
                                <option value="-1">不开启</option>
                                <option value="300000">5 分钟</option>
                                <option value="600000">10 分钟</option>
                                <option value="1800000">30 分钟</option>
                                <option value="3600000">一小时</option>
                                <option value="7200000">两小时</option>
                            </select>
                        </div>
                    </div>

                    <audio id="music-player" controls preload="metadata"></audio>

                    <div class="row" style="margin-top:.7rem; align-items:center">
                        <div class="ctrls">
                            <button class="btn-ink" onclick="back30sec()">后退 30 秒</button>
                            <button class="btn-ink" onclick="forward30sec()">前进 30 秒</button>
                        </div>
                        <span class="spacer"></span>
                        <a id="music-download" class="dl" href="#" download style="display:none">↓ 下载此音频</a>
                        <span style="color:var(--ink-soft);font-size:.85rem;margin-left:1rem">剩余 <span id="remainTime">—</span></span>
                    </div>
                </div>

                {% include comments.html %}
            </div>
        </main>

        <footer class="colophon">
            <div class="wrap">
                <p class="verse">剔刀锋利，越之不易。智者有云，得渡者稀。<span class="src">《奥义书》</span></p>
                <span class="foot-seal">玉</span>
                <p class="links"><a href="/index.html">返回主页</a> · <a href="#top">返回顶部</a></p>
            </div>
        </footer>
    </div>

    <a href="#top" class="totop" id="totop" aria-label="返回顶部">↑</a>

    <script src="/js/jquery-3.2.1.slim.min.js"></script>
    <!-- ⚠️ ?v= 是缓存击穿(同 comments.js 的约定)。GitHub Pages 给 js 设了
         Cache-Control: max-age=600,Cloudflare 还可能缓存更久 —— 改了
         musicplayer.js 就把它加一,否则回访用户跑的还是旧代码。
         v2:修「播放完停止」模式下不显示剩余时间。
         v3:修连续播放转场后卡在下一首开头、时长显示 0 秒(预取改为只取头部 512KB)。
         v4:加「时长 0」看门狗 —— 换曲后 10 秒元数据仍未到就重载自救。 -->
    <script src="/js/musicplayer.js?v=4"></script>
    <!-- ⚠️ 顺序有依赖:keepalive.js 用到 musicplayer.js 定义的 plog /
         pPlayIntent / musicPlayer,放在前面会 ReferenceError 静默失效。
         它负责 Android(尤其小米/澎湃OS)息屏后的保活:播放期间发射
         -58dB @18kHz 的听不见信号,让系统认定「页面有声音」,从而保住
         Chrome「最近 30 秒内发声」豁免,避免定时器被节流到每分钟一次。 -->
    <script src="/js/keepalive.js?v=2"></script>
    <script>
        (function () {
            var html = document.documentElement;
            var tb = document.getElementById('theme-btn');
            if (tb) tb.addEventListener('click', function () {
                var n = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
                html.setAttribute('data-theme', n);
                try { localStorage.setItem('yjz-theme', n); } catch (e) {}
                var m = document.querySelector('meta[name=theme-color]');
                if (m) m.setAttribute('content', n === 'dark' ? '#15171b' : '#f4efe3');
            });
            var tt = document.getElementById('totop');
            if (tt) addEventListener('scroll', function () { tt.classList.toggle('show', scrollY > 500); }, { passive: true });
        })();
    </script>
</body>

</html>
